# Builds the Inbox iPhone app (app/ + Capacitor shell in app/ios) on a GitHub Mac,
# signs it with Ilona's team and uploads it to TestFlight.
# Needs repository secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (App Store Connect API key, Admin).
name: iOS (TestFlight)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/ios.yml']

concurrency:
  group: ios-testflight
  cancel-in-progress: true

env:
  TEAM_ID: ASQ9FG4A3V
  VITE_HOMESERVER: https://matrix.simas.fit

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use the newest Xcode on the runner
        run: |
          XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Build the web app and copy it into the iPhone project
        working-directory: app
        run: |
          npm ci
          npm test
          npm run build
          npx cap sync ios

      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"

      # Built unsigned: automatic signing at archive time wants a development profile, which
      # needs a registered iPhone. The upload step below signs it for the App Store instead.
      - name: Archive
        working-directory: app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" MARKETING_VERSION=1.0 \
            archive

      # The archive is unsigned, so it carries no entitlements; export signing keeps the
      # ones it finds. Sign it locally (ad hoc) with ours so push notifications
      # (aps-environment) make it into the App Store build.
      - name: Add entitlements (push notifications)
        run: |
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          if [ -d "$APP/Frameworks" ]; then
            for f in "$APP"/Frameworks/*; do codesign --force --sign - "$f"; done
          fi
          codesign --force --sign - --entitlements app/ios/App/App/App.entitlements "$APP"
          codesign -d --entitlements - "$APP"

      - name: Sign for the App Store and upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Check the build can get notifications
        run: |
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa 2>/dev/null | head -1)
          if [ -z "$IPA" ]; then echo "No .ipa kept after upload; skipping the check"; exit 0; fi
          mkdir -p "$RUNNER_TEMP/ipa" && unzip -q -o "$IPA" -d "$RUNNER_TEMP/ipa"
          codesign -d --entitlements - "$RUNNER_TEMP"/ipa/Payload/*.app 2>&1 | tee "$RUNNER_TEMP/ent.txt"
          grep -q aps-environment "$RUNNER_TEMP/ent.txt" || { echo "::error::The signed app has no push entitlement"; exit 1; }

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
