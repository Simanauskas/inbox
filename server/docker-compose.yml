# The Inbox server: a private Matrix homeserver plus one bridge per chat app.
# Run ./setup.sh once (it generates every config), then `docker compose up -d`.
# Federation is off: nothing outside this machine can talk to it except your
# app, through the Cloudflare tunnel (or any HTTPS reverse proxy you prefer).

# A fixed project name, so containers and the database volume keep their names
# whatever folder this is in.
name: inbox

x-bridge: &bridge
  restart: unless-stopped
  depends_on:
    synapse: { condition: service_healthy }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./setup.sh first}
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --lc-collate=C --lc-ctype=C
    volumes:
      # Docker's own storage, not a folder on the Mac's disk: Postgres on a
      # shared Mac folder is very slow (first start took minutes).
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-bridges.sh:ro
    healthcheck:
      test: [CMD, pg_isready, -U, synapse, -d, synapse]
      interval: 5s
      retries: 20
      # first start creates the database; failures during this don't count
      start_period: 10m

  synapse:
    image: ${SYNAPSE_IMAGE:-matrixdotorg/synapse:latest}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ./data/synapse:/data
    ports:
      # only reachable from this machine; the tunnel (or a proxy) publishes it
      - 127.0.0.1:8008:8008
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8008/health]
      interval: 10s
      retries: 30
      start_period: 10m

  whatsapp:
    <<: *bridge
    image: ${WHATSAPP_IMAGE:-dock.mau.dev/mautrix/whatsapp:latest}
    volumes: [./data/whatsapp:/data]
    profiles: [whatsapp]

  telegram:
    <<: *bridge
    image: ${TELEGRAM_IMAGE:-dock.mau.dev/mautrix/telegram:latest}
    volumes: [./data/telegram:/data]
    profiles: [telegram]

  facebook:
    <<: *bridge
    image: ${META_IMAGE:-dock.mau.dev/mautrix/meta:latest}
    volumes: [./data/facebook:/data]
    profiles: [facebook]

  instagram:
    <<: *bridge
    image: ${INSTAGRAM_IMAGE:-dock.mau.dev/mautrix/meta:ig-latest}
    volumes: [./data/instagram:/data]
    profiles: [instagram]

  # Talks to the BlueBubbles server app on the Mac (same machine by default).
  imessage:
    <<: *bridge
    image: ${IMESSAGE_IMAGE:-dock.mau.dev/mautrix/imessage:latest}
    volumes: [./data/imessage:/data]
    extra_hosts: [host.docker.internal:host-gateway]
    profiles: [imessage]

  # Your phone book for the app: reads iCloud contacts (CardDAV) every 10 minutes
  # — or BlueBubbles on the Mac as a fallback — and writes contact-card changes
  # you confirm in Inbox back to iCloud. See contacts.py.
  contacts:
    image: python:3-alpine
    restart: unless-stopped
    command: [python, /app/contacts.py, --loop]
    environment:
      ICLOUD_USER: ${ICLOUD_USER:-}
      ICLOUD_APP_PASSWORD: ${ICLOUD_APP_PASSWORD:-}
      ICLOUD_CARDDAV_URL: ${ICLOUD_CARDDAV_URL:-}
      BLUEBUBBLES_URL: ${BLUEBUBBLES_URL:-}
      BLUEBUBBLES_PASSWORD: ${BLUEBUBBLES_PASSWORD:-}
      USER_ID: "@${ADMIN_USER}:${SERVER_NAME}"
    volumes:
      - ./contacts.py:/app/contacts.py:ro
      - ./data/synapse/doublepuppet.yaml:/app/doublepuppet.yaml:ro
      - ./data/contacts:/state
    extra_hosts: [host.docker.internal:host-gateway]
    depends_on:
      synapse: { condition: service_healthy }
    profiles: [contacts]

  # Push gateway: turns Synapse's notifications into Web Push messages, so the
  # app notifies you even when it's closed.
  sygnal:
    image: ${SYGNAL_IMAGE:-matrixdotorg/sygnal:latest}
    restart: unless-stopped
    environment:
      SYGNAL_CONF: /data/sygnal.yaml
    volumes:
      - ./data/sygnal:/data

  # Publishes Synapse at https://<MATRIX_HOST> without opening any ports.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [synapse]
    profiles: [tunnel]

networks:
  default:
    # A fixed range, so Synapse can be allowed to reach the push gateway on it
    # (it refuses private addresses by default).
    ipam:
      config:
        - subnet: 172.31.250.0/24

volumes:
  pgdata:
